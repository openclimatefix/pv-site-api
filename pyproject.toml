[build-system]
requires = ["setuptools>=67", "setuptools-git-versioning>=2.0,<3"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-site-api"
dynamic = ["version"]
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{ name = "Open Climate Fix Team", email = "info@openclimatefix.org"}]
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "uvicorn[standard]>=0.20.0,<0.21.0",
    "psycopg2-binary>=2.9.5,<3.0.0",
    "sqlalchemy>=2.0,<3.0",
    "fastapi==0.103.1",
    "httpx>=0.23.3,<0.24.0",
    "sentry-sdk>=1.16.0,<2.0.0",
    "pvlib>=0.9.5,<0.10.0",
    "numpy<2.0.0",
    "structlog>=22.3.0,<23.0.0",
    "pyjwt[crypto]>=2.6.0,<3.0.0",
    "geopandas>=0.14.2,<0.15.0",
    "psutil>=6.0.0,<7.0.0",
    "pvsite-datamodel==1.2.0",
    "apitally[fastapi]>=0.24.4,<0.25.0",
    "grpcio>=1.50.0,<2.0.0",
    "protobuf>=5.26.0",
    "dp-sdk",
]

[dependency-groups]
dev = [
    "isort>=5.12.0,<6",
    "ruff",
    "black>=23.1.0,<24",
    "pytest>=7.2.1,<8",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0,<5",
    "testcontainers-postgres>=0.0.1rc1,<0.0.2",
    "ipython>=8.11.0,<9",
    "freezegun>=1.2.2,<2",
]

[tool.uv.sources]
dp-sdk = { url = "https://github.com/openclimatefix/data-platform/releases/download/v0.34.0/dp_sdk-0.34.0-py3-none-any.whl" }

[tool.setuptools.packages.find]
include = ["pv_site_api*"]

[tool.setuptools-git-versioning]
enabled = true
template = "{tag}"
dirty_template = "{tag}"

[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F"]
