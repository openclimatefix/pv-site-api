name: Branch CI
run-name: 'Branch CI for ${{ github.event.head_commit.message }} by ${{ github.actor }}'

on:
  push:
    branches-ignore: ["main"]
    paths-ignore: ['README.md']

permissions:
  packages: write
  contents: read

jobs:
  branch-ci:
    uses: openclimatefix/.github/.github/workflows/branch_ci.yml@v2.0.1
    secrets: inherit
    with:
      enable_linting: true
      enable_typechecking: false
      tests_folder: tests
      containerfile: infrastructure/Dockerfile
      image_base_name: openclimatefix/nowcasting_site_api
