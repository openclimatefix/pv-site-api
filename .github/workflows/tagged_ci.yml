name: Tagged CI
run-name: 'Tagged CI for ${{ github.ref_name }} by ${{ github.actor }}'

on:
  push:
    tags: ["v*.*.*"]

permissions:
  packages: write
  contents: read
  id-token: write

jobs:
  tagged-ci:
    uses: openclimatefix/.github/.github/workflows/tagged_ci.yml@v2.0.1
    secrets: inherit
    with:
      containerfile: infrastructure/Dockerfile
      image_base_name: openclimatefix/nowcasting_site_api
